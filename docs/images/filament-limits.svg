<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc"><title id="title">Choose nozzles and check limits</title><desc id="desc">Illustration: find installed S1 printers, choose the nozzle sizes and enter maximum temperatures confirmed for your own hardware and firmware.</desc><rect x="0" y="0" width="1000" height="400" rx="8" fill="#171b22"/><g font-family="Segoe UI,Arial,sans-serif" fill="#edf2f8"><rect x="25" y="24" width="615" height="351" rx="8" fill="#222832"/><text x="48" y="63" font-size="24" fill="#edf2f8">2  Choose destination &amp; limits</text><rect x="47" y="83" width="567" height="45" rx="8" fill="#0074d9"/><text x="140" y="113" font-size="23" fill="#edf2f8">Find installed S1 printers</text><rect x="47" y="145" width="567" height="75" rx="8" fill="#2c3441"/><text x="62" y="176" font-size="21" fill="#edf2f8">Choose the nozzle size(s) you use.</text><text x="62" y="206" font-size="19" fill="#b0bdce">Hold Ctrl to pick more than one.</text><text x="48" y="260" font-size="20" fill="#edf2f8">Nozzle ceiling (°C)</text><text x="338" y="260" font-size="20" fill="#edf2f8">Bed ceiling (°C)</text><rect x="47" y="273" width="270" height="48" rx="8" fill="#2c3441"/><rect x="337" y="273" width="277" height="48" rx="8" fill="#2c3441"/><text x="62" y="305" font-size="20" fill="#edf2f8">Your checked limit</text><text x="352" y="305" font-size="20" fill="#edf2f8">Your checked limit</text><text x="700" y="151" font-size="24" fill="#edf2f8">Match your hardware.</text><text x="700" y="207" font-size="24" fill="#edf2f8">Use confirmed limits.</text><text x="700" y="260" font-size="26" fill="#ffc071">Do not guess.</text><text x="700" y="298" font-size="22" fill="#edf2f8">The app does NOT</text><text x="700" y="330" font-size="22" fill="#edf2f8">change firmware.</text><text x="970" y="387" text-anchor="end" font-size="14" fill="#b0bdce">Button illustration</text></g></svg>
