<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc"><title id="title">Pick your nozzle</title><desc id="desc">Illustration: choose the size and material fitted in your printer, then Discover matching profiles. 0.4 hardened steel is an example.</desc><rect width="1000" height="410" rx="18" fill="#171b22"/><g font-family="Segoe UI,Arial,sans-serif" fill="#edf2f8"><rect x="25" y="22" width="615" height="362" rx="8" fill="#222832" stroke="none" stroke-width="3"/><text x="48" y="62" font-size="25" fill="#edf2f8">2  Choose your S1 setup</text><text x="48" y="103" font-size="20" fill="#edf2f8">Nozzle size (mm)</text><text x="283" y="103" font-size="20" fill="#edf2f8">Nozzle material</text><rect x="47" y="114" width="210" height="46" rx="8" fill="#2c3441" stroke="#69b3ff" stroke-width="3"/><text x="65" y="145" font-size="23" fill="#edf2f8">0.4   ▾</text><rect x="280" y="114" width="334" height="46" rx="8" fill="#2c3441" stroke="#69b3ff" stroke-width="3"/><text x="295" y="145" font-size="22" fill="#edf2f8">hardened-steel    ▾</text><rect x="47" y="179" width="567" height="52" rx="8" fill="#0074d9" stroke="none" stroke-width="3"/><text x="132" y="213" font-size="24" fill="#edf2f8">Discover matching profiles</text><text x="48" y="267" font-size="18" fill="#edf2f8">Printer profile</text><rect x="47" y="277" width="567" height="37" rx="8" fill="#2c3441" stroke="none" stroke-width="3"/><text x="61" y="302" font-size="18" fill="#edf2f8">Anycubic Kobra S1 0.4 nozzle     ▾</text><text x="48" y="344" font-size="20" fill="#edf2f8">Print profile: choose your print settings.</text><path d="M678 139h-48m18-13-18 13 18 13" fill="none" stroke="#69b3ff" stroke-width="5"/><text x="700" y="130" font-size="24" fill="#edf2f8">Match your nozzle.</text><text x="700" y="161" font-size="18" fill="#edf2f8">0.4 is only an example.</text><path d="M678 205h-48m18-13-18 13 18 13" fill="none" stroke="#69b3ff" stroke-width="5"/><text x="700" y="212" font-size="24" fill="#edf2f8">Then click this.</text><text x="970" y="398" text-anchor="end" font-size="14" fill="#b0bdce">Button illustration · example choices</text></g></svg>
