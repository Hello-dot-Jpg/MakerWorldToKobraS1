<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Review, export, then install</title><desc id="desc">Illustration: review selected presets and export them. Close Anycubic before installing. Use Install reviewed export, keep the backup, restart Anycubic and test a small print.</desc><rect x="0" y="0" width="1000" height="420" rx="8" fill="#171b22"/><g font-family="Segoe UI,Arial,sans-serif" fill="#edf2f8"><rect x="25" y="24" width="615" height="370" rx="8" fill="#222832"/><text x="48" y="65" font-size="25" fill="#edf2f8">3  Review &amp; export</text><rect x="47" y="87" width="567" height="47" rx="8" fill="#2c3441"/><text x="156" y="119" font-size="23" fill="#edf2f8">Review selected presets</text><rect x="47" y="152" width="567" height="47" rx="8" fill="#0074d9"/><text x="229" y="184" font-size="23" fill="#edf2f8">Export presets…</text><text x="48" y="242" font-size="23" fill="#edf2f8">Install or restore reviewed presets</text><rect x="47" y="260" width="567" height="49" rx="8" fill="#0074d9"/><text x="179" y="293" font-size="22" fill="#edf2f8">Install reviewed export…</text><rect x="47" y="328" width="567" height="45" rx="8" fill="#2c3441"/><text x="161" y="358" font-size="22" fill="#edf2f8">Restore an installation…</text><text x="700" y="115" font-size="23" fill="#edf2f8">1. Review, then export.</text><text x="700" y="179" font-size="25" fill="#ffc071">2. Close Anycubic.</text><text x="700" y="240" font-size="24" fill="#edf2f8">3. Install the export.</text><text x="700" y="283" font-size="23" fill="#edf2f8">Keep the backup.</text><text x="700" y="343" font-size="23" fill="#edf2f8">Restart Anycubic.</text><text x="700" y="379" font-size="21" fill="#edf2f8">Try a small print first.</text><text x="970" y="407" text-anchor="end" font-size="14" fill="#b0bdce">Button illustration</text></g></svg>
