<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">Add filament setting files</title><desc id="desc">Illustration: open Filament library beta. Add downloaded JSON files, a folder or a bundle. Then find installed S1 printers.</desc><rect x="0" y="0" width="1000" height="330" rx="8" fill="#171b22"/><g font-family="Segoe UI,Arial,sans-serif" fill="#edf2f8"><rect x="25" y="24" width="615" height="283" rx="8" fill="#222832"/><text x="48" y="65" font-size="26" fill="#edf2f8">Filament library · beta</text><text x="48" y="113" font-size="24" fill="#edf2f8">1  Add filament presets</text><rect x="47" y="134" width="177" height="45" rx="8" fill="#0074d9"/><text x="64" y="164" font-size="22" fill="#edf2f8">JSON files…</text><rect x="240" y="134" width="150" height="45" rx="8" fill="#2c3441"/><text x="266" y="164" font-size="22" fill="#edf2f8">Folder…</text><rect x="408" y="134" width="205" height="45" rx="8" fill="#2c3441"/><text x="446" y="164" font-size="22" fill="#edf2f8">Bundle…</text><rect x="47" y="203" width="567" height="43" rx="8" fill="#2c3441"/><text x="63" y="232" font-size="20" fill="#edf2f8">Your downloaded filament setting files</text><text x="700" y="132" font-size="25" fill="#edf2f8">Pick the tab first.</text><text x="700" y="179" font-size="23" fill="#edf2f8">Then add your files.</text><text x="700" y="243" font-size="20" fill="#b0bdce">No 3MF changes here.</text><text x="970" y="317" text-anchor="end" font-size="14" fill="#b0bdce">Button illustration</text></g></svg>
