<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc"><title id="title">Pick your filament</title><desc id="desc">Illustration: choose the material on your spool under Filament assignments. Check every row.</desc><rect width="1000" height="290" rx="18" fill="#171b22"/><g font-family="Segoe UI,Arial,sans-serif" fill="#edf2f8"><rect x="25" y="22" width="615" height="242" rx="8" fill="#222832" stroke="none" stroke-width="3"/><text x="48" y="67" font-size="25" fill="#edf2f8">Filament assignments</text><text x="48" y="111" font-size="20" fill="#edf2f8">Filament 1</text><rect x="47" y="130" width="567" height="61" rx="8" fill="#2c3441" stroke="#69b3ff" stroke-width="3"/><text x="63" y="170" font-size="27" fill="#edf2f8">Anycubic PETG                  ▾</text><text x="48" y="233" font-size="20" fill="#b0bdce">PETG shown as an example.</text><path d="M678 161h-48m18-13-18 13 18 13" fill="none" stroke="#69b3ff" stroke-width="5"/><text x="700" y="130" font-size="23" fill="#edf2f8">What is on your spool?</text><text x="700" y="168" font-size="22" fill="#edf2f8">Pick PLA, PETG, etc.</text><text x="700" y="210" font-size="19" fill="#edf2f8">More rows? Check them all.</text><text x="970" y="278" text-anchor="end" font-size="14" fill="#b0bdce">Button illustration · example choices</text></g></svg>
