<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Check, then save</title><desc id="desc">Illustration: Review changes and read the report first. Stop if blocked. Choose output selects a new name. Export 3MF saves the new copy.</desc><rect width="1000" height="420" rx="18" fill="#171b22"/><g font-family="Segoe UI,Arial,sans-serif" fill="#edf2f8"><rect x="25" y="22" width="615" height="372" rx="8" fill="#222832" stroke="none" stroke-width="3"/><text x="48" y="62" font-size="25" fill="#edf2f8">Review &amp; change report</text><rect x="47" y="78" width="567" height="95" rx="8" fill="#171b22" stroke="none" stroke-width="3"/><text x="66" y="111" font-size="21" fill="#b0bdce">Read the messages here.</text><text x="66" y="148" font-size="23" fill="#ffc071">Blocked? Stop and check why.</text><text x="48" y="215" font-size="24" fill="#edf2f8">4  Export a reviewed project</text><rect x="47" y="232" width="567" height="38" rx="8" fill="#2c3441" stroke="none" stroke-width="3"/><text x="64" y="258" font-size="21" fill="#edf2f8">my_model_S1.3mf</text><rect x="47" y="284" width="247" height="45" rx="8" fill="#2c3441" stroke="#b0bdce" stroke-width="3"/><text x="75" y="315" font-size="22" fill="#edf2f8">Choose output…</text><rect x="47" y="342" width="272" height="42" rx="8" fill="#2c3441" stroke="#69b3ff" stroke-width="3"/><text x="87" y="371" font-size="22" fill="#edf2f8">Review changes</text><rect x="339" y="342" width="275" height="42" rx="8" fill="#0074d9" stroke="none" stroke-width="3"/><text x="406" y="371" font-size="24" fill="#edf2f8">Export 3MF</text><text x="690" y="120" font-size="25" fill="#edf2f8">1. Review changes.</text><text x="690" y="157" font-size="22" fill="#edf2f8">Read the report first.</text><text x="690" y="246" font-size="25" fill="#edf2f8">2. Choose output…</text><text x="690" y="282" font-size="22" fill="#edf2f8">Give it a new name.</text><text x="690" y="349" font-size="25" fill="#edf2f8">3. Export 3MF.</text><text x="690" y="381" font-size="22" fill="#edf2f8">This saves the new copy.</text><text x="970" y="408" text-anchor="end" font-size="14" fill="#b0bdce">Button illustration · example choices</text></g></svg>
