<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">Check the plate in Anycubic</title><desc id="desc">Illustration: open the new file in Anycubic Slicer Next, check the nozzle and Plate Type. Textured PEI Plate is for your textured plate. Then slice and check Preview.</desc><rect width="1000" height="330" rx="18" fill="#171b22"/><g font-family="Segoe UI,Arial,sans-serif" fill="#edf2f8"><rect x="25" y="23" width="615" height="284" rx="8" fill="#2d2f33" stroke="none" stroke-width="3"/><text x="49" y="64" font-size="24" fill="#edf2f8">In Anycubic Slicer Next</text><text x="49" y="107" font-size="21" fill="#edf2f8">Printer</text><rect x="47" y="117" width="567" height="40" rx="8" fill="#25272a" stroke="none" stroke-width="3"/><text x="62" y="144" font-size="20" fill="#edf2f8">Anycubic Kobra S1 0.4 nozzle</text><text x="49" y="192" font-size="22" fill="#edf2f8">Plate Type</text><rect x="47" y="204" width="567" height="62" rx="8" fill="#25272a" stroke="#69b3ff" stroke-width="3"/><text x="64" y="244" font-size="28" fill="#edf2f8">Textured PEI Plate        ▾</text><path d="M678 235h-48m18-13-18 13 18 13" fill="none" stroke="#69b3ff" stroke-width="5"/><text x="700" y="129" font-size="25" fill="#edf2f8">Open the NEW file.</text><text x="700" y="179" font-size="23" fill="#edf2f8">Check the plate here.</text><text x="700" y="211" font-size="19" fill="#ffc071">Anycubic can remember</text><text x="700" y="238" font-size="19" fill="#ffc071">the wrong plate.</text><text x="700" y="280" font-size="22" fill="#edf2f8">Slice → Preview → print.</text><text x="970" y="318" text-anchor="end" font-size="14" fill="#b0bdce">Button illustration · example choices</text></g></svg>
